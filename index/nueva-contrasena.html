<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Nueva contraseña | Vending Mini Market"
    >

    <title>Nueva contraseña | Vending Mini Market</title>

    <link rel="stylesheet" href="../css/estilos.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="pagina-login">

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="encabezado-login">

                <h1>
                    Nueva contraseña
                </h1>

                <p>
                    Ingrese y confirme su nueva contraseña.
                </p>

            </div>

            <form
                id="formularioNuevaContrasena"
                class="formulario-login"
                novalidate
            >

                <div class="campo-formulario">

                    <label for="nuevaContrasena">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        id="nuevaContrasena"
                        name="nuevaContrasena"
                        placeholder="Ingrese su nueva contraseña"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="campo-formulario">

                    <label for="confirmarContrasena">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarContrasena"
                        name="confirmarContrasena"
                        placeholder="Confirme su nueva contraseña"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <p
                    id="mensajeNuevaContrasena"
                    class="mensaje-login"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="boton boton-azul boton-login"
                >
                    <i class="fa-solid fa-key"></i>
                    Cambiar contraseña
                </button>

            </form>

            <div class="acciones-login">

                <a
                    href="index.html"
                    class="enlace-recuperar"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Volver al inicio de sesión
                </a>

            </div>

        </section>

    </main>

<script>
    const formulario = document.getElementById(
        "formularioNuevaContrasena"
    );

    const mensaje = document.getElementById(
        "mensajeNuevaContrasena"
    );

    formulario.addEventListener("submit", async function (evento) {

        evento.preventDefault();

        const nuevaContrasena = document
            .getElementById("nuevaContrasena")
            .value;

        const confirmarContrasena = document
            .getElementById("confirmarContrasena")
            .value;

        mensaje.textContent = "";

        if (!nuevaContrasena || !confirmarContrasena) {
            mensaje.textContent =
                "Complete todos los campos.";
            return;
        }

        if (nuevaContrasena !== confirmarContrasena) {
            mensaje.textContent =
                "Las contraseñas no coinciden.";
            return;
        }

        if (nuevaContrasena.length < 8) {
            mensaje.textContent =
                "La contraseña debe tener al menos 8 caracteres.";
            return;
        }

        try {

            const respuesta = await fetch(
                "../api/auth/restablecer_contrasena.php",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nuevaContrasena: nuevaContrasena,
                        confirmarContrasena: confirmarContrasena
                    })
                }
            );

            const resultado = await respuesta.json();

            if (!respuesta.ok || !resultado.success) {

                mensaje.textContent =
                    resultado.message ||
                    "No fue posible restablecer la contraseña.";

                return;
            }

            mensaje.textContent =
                resultado.message;

            formulario.reset();

            setTimeout(function () {
                window.location.href = "index.html";
            }, 2000);

        } catch (error) {

            console.error(error);

            mensaje.textContent =
                "No fue posible comunicarse con el servidor.";
        }
    });
</script>

</body>

</html>
