<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Validación de recuperación de contraseña | Vending Mini Market"
    >
    <meta name="referrer" content="no-referrer">

    <title>Validar recuperación | Vending Mini Market</title>

    <link rel="stylesheet" href="../css/estilos.css?v=20261105-2">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="pagina-login pagina-recuperacion">

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="encabezado-login">

                <h1>
                    Validar recuperación
                </h1>

                <p>
                    Estamos validando su solicitud
                    de recuperación de contraseña.
                </p>

            </div>

            <form
                id="formularioValidarRecuperacion"
                class="formulario-login"
                novalidate
            >

                <p
                    id="mensajeValidacionRecuperacion"
                    class="mensaje-login"
                    aria-live="polite"
                ></p>

                <button
                    type="button"
                    id="botonValidarRecuperacion"
                    class="boton boton-azul boton-login"
                >
                    Confirmar identidad y recibir contraseña temporal
                </button>

            </form>

            <div class="acciones-login">

                <a
                    href="index.html"
                    class="enlace-recuperar"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Volver al inicio de sesión
                </a>

            </div>

        </section>

    </main>


    <script>
        const formulario = document.getElementById(
            "formularioValidarRecuperacion"
        );

        const mensaje = document.getElementById(
            "mensajeValidacionRecuperacion"
        );

        const parametros = new URLSearchParams(
            window.location.search
        );

        const token = parametros.get("token");

        async function validarRecuperacion() {

            const boton = document.getElementById("botonValidarRecuperacion");
            boton.disabled = true;
            mensaje.textContent = "Validando su solicitud...";

            if (!token) {

                mensaje.textContent =
                    "El enlace de recuperación no es válido.";
                boton.disabled = false;

                return;
            }

            try {

                const respuesta = await fetch(
                    "../api/auth/validar_recuperacion.php",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token: token
                        })
                    }
                );

                const resultado = await respuesta.json();

                if (!respuesta.ok || !resultado.success) {

                    mensaje.textContent =
                        resultado.message ||
                        "El enlace de recuperación no es válido o ha expirado.";
                    boton.disabled = false;

                    return;
                }

                mensaje.textContent =
                    resultado.message;
                boton.hidden = true;

                setTimeout(function () {
                    window.location.href =
                        "index.html";
                }, 4000);

            } catch (error) {

                console.error(error);

                mensaje.textContent =
                    "No fue posible comunicarse con el servidor.";
                boton.disabled = false;
            }
        }

        document
            .getElementById("botonValidarRecuperacion")
            .addEventListener("click", validarRecuperacion);
    </script>

</body>

</html>
